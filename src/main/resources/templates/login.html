<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><section class="auth"><p class="eyebrow">WELCOME BACK</p><h1>반가워요.</h1><p>로그인하고 나만의 일상을 채워 보세요.</p><p class="error" th:if="${param.error}">이메일 또는 비밀번호를 확인하세요.</p><form th:action="@{/login}" method="post"><label>이메일<input type="email" name="username" required autocomplete="username"></label><label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label><button>로그인</button></form><a href="/signup">처음 오셨나요? 회원가입</a><aside>로컬 시연 계정<br>demo@teamshop.local / Demo1234!<br>admin@teamshop.local / Admin1234!</aside></section></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
