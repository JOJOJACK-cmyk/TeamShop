<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><p class="eyebrow">ADMINISTRATION</p><div class="section-heading"><h1>상품 관리</h1><a class="button" href="/admin/products/new">새 상품 등록 +</a></div><table><thead><tr><th>ID / 상품명</th><th>카테고리</th><th>가격</th><th>재고</th><th>판매 상태</th><th>관리</th></tr></thead><tbody><tr th:each="p:${products}"><td th:text="|${p.id}. ${p.name}|"></td><td th:text="${p.category}"></td><td th:text="${p.price}"></td><td th:text="${p.stock}"></td><td th:text="${p.active?'판매 중':'판매 중지'}"></td><td><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">수정</a><form class="inline" th:action="@{/admin/products/{id}/toggle(id=${p.id})}" method="post"><button class="link" th:text="${p.active?'판매 중지':'판매 재개'}"></button></form></td></tr></tbody></table></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
