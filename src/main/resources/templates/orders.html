<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><p class="eyebrow">MY ORDERS</p><h1>주문내역</h1><p class="empty" th:if="${#lists.isEmpty(orders)}">주문 내역이 없습니다.</p><table th:unless="${#lists.isEmpty(orders)}"><thead><tr><th>주문번호</th><th>주문일시</th><th>금액</th><th>상태</th><th></th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="|TS-${o.id}|"></td><td th:text="${o.created_at}"></td><td th:text="|${#numbers.formatInteger(o.total,0,'COMMA')}원|"></td><td th:text="${o.status=='PLACED'?'주문 완료':'취소 완료'}"></td><td><a th:href="@{/orders/{id}(id=${o.id})}">상세 보기 ↗</a></td></tr></tbody></table></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
