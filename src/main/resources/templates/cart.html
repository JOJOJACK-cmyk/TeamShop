<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><p class="eyebrow">YOUR SELECTION</p><h1>장바구니</h1><p class="empty" th:if="${#lists.isEmpty(items)}">아직 담은 상품이 없어요. <a href="/">상품 둘러보기</a></p><div th:unless="${#lists.isEmpty(items)}"><table><thead><tr><th>상품</th><th>가격</th><th>수량</th><th>관리</th></tr></thead><tbody><tr th:each="i:${items}"><td><a th:href="@{/products/{id}(id=${i.product_id})}" th:text="${i.name}"></a><small th:unless="${i.active}">판매 중지</small></td><td th:text="|${#numbers.formatInteger(i.price,0,'COMMA')}원|"></td><td><form class="inline" th:action="@{/cart/{id}/quantity(id=${i.id})}" method="post"><input aria-label="수량" name="quantity" type="number" min="1" max="99" th:value="${i.quantity}" required><button class="secondary">변경</button></form></td><td><form th:action="@{/cart/{id}/delete(id=${i.id})}" method="post"><button class="link">삭제</button></form></td></tr></tbody></table><section class="checkout"><div><h2>배송 정보</h2><p>주문 상태와 재고 변경을 확인하는 실습입니다.<br>결제와 배송은 진행되지 않습니다.</p></div><form th:action="@{/orders}" method="post"><label>받는 분<input name="recipient" maxlength="40" required></label><label>주소<input name="address" maxlength="250" required></label><h2 th:text="|합계 ${#numbers.formatInteger(total,0,'COMMA')}원|"></h2><button>주문하기</button></form></section></div></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
