<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><section class="auth"><p class="eyebrow">JOIN TEAMSHOP</p><h1>취향의 시작.</h1><form th:action="@{/signup}" method="post"><label>이름<input name="name" maxlength="40" required></label><label>이메일<input type="email" name="email" maxlength="150" required></label><label>비밀번호<input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"><small>8~72자로 입력해 주세요.</small></label><button>회원가입</button></form></section></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
