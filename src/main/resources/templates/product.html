<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><div class="breadcrumb"><a href="/">전체 상품</a> / <span th:text="${p.category}"></span></div><section class="detail"><div class="product-art large" th:classappend="${p.category=='주방'?'kitchen':(p.category=='리빙'?'living':'desk')}"><span th:text="${p.category=='주방'?'◡':(p.category=='리빙'?'▤':'▱')}"></span></div><div><p class="eyebrow" th:text="${p.category}"></p><h1 th:text="${p.name}"></h1><h2 th:text="|${#numbers.formatInteger(p.price,0,'COMMA')}원|"></h2><p class="description" th:text="${p.description}"></p><p th:text="|남은 수량 ${p.stock}개|"></p><form th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${p.id}"><label>구매 수량<input type="number" name="quantity" value="1" min="1" th:max="${p.stock>99?99:p.stock}" required></label><button th:disabled="${p.stock==0}" th:text="${p.stock==0?'품절된 상품':'장바구니에 담기'}"></button></form><p class="muted">상품 이미지는 카테고리 그래픽입니다.</p></div></section></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
