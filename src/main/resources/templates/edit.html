<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><section class="auth wide"><p class="eyebrow">PRODUCT EDITOR</p><h1 th:text="${p.id==0?'상품 등록':'상품 수정'}"></h1><form th:action="@{/admin/products/save}" method="post"><input type="hidden" name="id" th:value="${p.id}"><label>상품명<input name="name" th:value="${p.name}" maxlength="100" required></label><label>카테고리<select name="category"><option th:each="c:${ {'주방','리빙','문구'} }" th:value="${c}" th:text="${c}" th:selected="${c==p.category}"></option></select></label><label>상품 설명<textarea name="description" rows="4" maxlength="1500" required th:text="${p.description}"></textarea></label><label>가격<input name="price" type="number" min="1" max="10000000" th:value="${p.price}" required></label><label>재고<input name="stock" type="number" min="0" max="1000000" th:value="${p.stock}" required></label><button>저장하기</button></form></section></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
