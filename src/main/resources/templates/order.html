<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamShop · 일상을 채우는 물건</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">teamshop<span>생활의 작은 취향</span></a><nav><a href="/">상품 둘러보기</a><a href="/cart">장바구니</a><a href="/orders">주문내역</a><a th:if="${isAdmin}" href="/admin/products">상품관리</a><a th:unless="${signedIn}" href="/login">로그인</a><form th:if="${signedIn}" th:action="@{/logout}" method="post"><button class="link">로그아웃</button></form></nav></header><main><div class="notice" th:if="${message}" th:text="${message}"></div><p class="eyebrow">ORDER DETAIL</p><h1 th:text="|주문 TS-${order.id}|"></h1><p th:text="${order.status=='PLACED'?'주문이 완료되었습니다.':'취소가 완료되었습니다.'}"></p><table><thead><tr><th>상품</th><th>주문 당시 단가</th><th>수량</th></tr></thead><tbody><tr th:each="i:${items}"><td th:text="${i.product_name}"></td><td th:text="|${#numbers.formatInteger(i.unit_price,0,'COMMA')}원|"></td><td th:text="${i.quantity}"></td></tr></tbody></table><section class="checkout"><div><h2>배송 정보</h2><p th:text="${order.recipient}"></p><p th:text="${order.address}"></p></div><div><h2 th:text="|총 ${#numbers.formatInteger(order.total,0,'COMMA')}원|"></h2><form th:if="${order.status=='PLACED'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post"><button class="secondary">주문 취소</button></form><p class="muted">주문 취소 시 상품 재고를 복원합니다.</p><a href="/orders">전체 주문내역</a></div></section></main><footer><b>teamshop</b><span>일상을 채우는 작은 선택. Spring 기반 학습 프로젝트</span><small>주문 실습용 서비스 · 실제 결제 및 배송 없음</small></footer></body></html>
